services:
  db:
    image: postgres:16-alpine
    container_name: vap-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vap
      POSTGRES_PASSWORD: vap
      POSTGRES_DB: vap
    ports:
      - '5432:5432'
    volumes:
      - vap-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vap -d vap']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vap-db-data:
